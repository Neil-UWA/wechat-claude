name: Publish (dev)

# Publishes a throwaway prerelease so a change can be installed and tested
# without touching the `latest` tag.
#
# Two ways in:
#   * push to `dev`            -> published under the `dev` dist-tag
#   * manual run on any branch -> published under `dev-<branch>`, so a single
#     feature can be tested on its own without whatever else sits on `dev`
#     (Actions -> Publish (dev) -> Run workflow -> pick the branch, or
#      `gh workflow run publish-dev.yml --ref my-feature-branch`)
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "npm dist-tag to move (default: dev for the dev branch, dev-<branch> elsewhere)"
        required: false
        default: ""

concurrency:
  group: publish-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Work out the prerelease version and dist-tag
        id: version
        run: |
          BRANCH="${{ github.ref_name }}"
          # Branch names become semver prerelease identifiers, which only allow
          # [0-9A-Za-z-], so fold everything else into a dash.
          SLUG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          [ -n "$SLUG" ] || SLUG=branch

          BASE=$(node -p "require('./package.json').version.split('-')[0]")
          if [ "$BRANCH" = "dev" ]; then
            VERSION="$BASE-dev.${{ github.run_number }}.$(git rev-parse --short HEAD)"
            DEFAULT_TAG=dev
          else
            VERSION="$BASE-dev.$SLUG.${{ github.run_number }}.$(git rev-parse --short HEAD)"
            DEFAULT_TAG="dev-$SLUG"
          fi

          TAG="${{ inputs.dist_tag }}"
          [ -n "$TAG" ] || TAG="$DEFAULT_TAG"

          npm version "$VERSION" --no-git-tag-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: npm publish --provenance --access public --tag "${{ steps.version.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summarise how to install it
        run: |
          NAME=$(node -p "require('./package.json').name")
          {
            echo "### Published \`$NAME@${{ steps.version.outputs.version }}\`"
            echo
            echo "From branch \`${{ github.ref_name }}\`, under dist-tag \`${{ steps.version.outputs.tag }}\`."
            echo
            echo '```sh'
            echo "npm i $NAME@${{ steps.version.outputs.tag }}      # follows this branch"
            echo "npm i $NAME@${{ steps.version.outputs.version }}  # pins this exact build"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
